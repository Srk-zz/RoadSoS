<html>
<body style="font-family: sans-serif; line-height: 1.6; color: #333;">
    <div style="background: #d32f2f; color: white; padding: 20px; text-align: center;">
        <h1>AMBULANCE DISPATCH ALERT</h1>
    </div>
    <div style="padding: 20px; border: 1px solid #ddd;">
        <p><strong>Incident ID:</strong> {{ incident_id }}</p>
        <p><strong>Patient Name:</strong> {{ patient_name }}</p>
        <p><strong>Location:</strong> 
            <a href="https://www.google.com/maps?q={{ lat }},{{ lng }}">View on Google Maps</a>
        </p>
        <p><strong>Alert Time:</strong> {{ timestamp }}</p>
        <hr>
        <p style="color: #777; font-size: 12px;">This is an automated alert from the Road SOS Platform.</p>
    </div>
</body>
</html>
